name: CI/CD - Build and Push Docker Image to ECR

on:
  workflow_dispatch:
    inputs:
      docker_tag:
        description: 'Tag to use for the Docker image (e.g., latest, v1.0, build-42)'
        required: true
        default: 'latest'

jobs:
  build-and-push:
    name: Build and Push Docker Image
    runs-on: ubuntu-latest

    env:
      AWS_REGION: us-west-2
      ECR_REGISTRY: 494110626524.dkr.ecr.us-west-2.amazonaws.com
      ECR_REPOSITORY: mohan/petclinic
      JAVA_VERSION: 17

    steps:
      # 🧱 Step 1: Checkout code
      - name: Checkout repository
        uses: actions/checkout@v4

      # ☕ Step 2: Set up JDK 17
      - name: Set up JDK ${{ env.JAVA_VERSION }}
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: ${{ env.JAVA_VERSION }}

      # ⚙️ Step 3: Build with Maven (skip tests)
      - name: Build with Maven
        run: |
          echo "🚀 Building project with Maven (skipping tests)..."
          mvn clean install -DskipTests -s ./settings.xml

      # 🔐 Step 4: Configure AWS credentials
      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ env.AWS_REGION }}

      # 🐳 Step 5: Log in to Amazon ECR
      - name: Log in to Amazon ECR
        id: ecr-login
        uses: aws-actions/amazon-ecr-login@v2

      # 📦 Step 6: Ensure ECR repository exists
      - name: Create ECR repository if it doesn't exist
        run: |
          aws ecr describe-repositories \
            --repository-names "${{ env.ECR_REPOSITORY }}" \
            --region "${{ env.AWS_REGION }}" \
            >/dev/null 2>&1 || \
          aws ecr create-repository \
            --repository-name "${{ env.ECR_REPOSITORY }}" \
            --region "${{ env.AWS_REGION }}" \
            --image-scanning-configuration scanOnPush=true

      # 🏗️ Step 7: Build and push Docker image to ECR
      - name: Build and push Docker image
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: ${{ env.ECR_REGISTRY }}/${{ env.ECR_REPOSITORY }}:${{ github.event.inputs.docker_tag }}

      # 🧹 Step 8: Cleanup workspace (optional)
      - name: Cleanup workspace
        run: |
          echo "🧹 Cleaning up workspace..."
          sudo rm -rf *

      - name: Success message
        if: ${{ success() }}
        run: |
          echo "✅ Build and push to ECR completed successfully."
          echo "Image: ${{ env.ECR_REGISTRY }}/${{ env.ECR_REPOSITORY }}:${{ github.event.inputs.docker_tag }}"

      - name: Failure message
        if: ${{ failure() }}
        run: echo "❌ Build failed. Check logs for details."